[project]
name = "foot-3d-spike"
version = "0.0.1"
description = "Spike: dense foot template correspondences (FOCUS TOC model) and single-view foot pose"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0",
  "torchvision==0.26.0",
  "geffnet==1.0.2",
  "opencv-python==4.13.0.92",
  "numpy",
  "scipy",
  "rtmlib==0.0.16",
  "onnxruntime==1.26.0",
  "segmentation-models-pytorch>=0.5.0",
  "timm>=1.0.29",
]

[tool.uv]
package = false
